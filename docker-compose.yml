# Local SQL Server for development. Start with: docker compose up -d
# The password is for local development only and matches appsettings.Development.json.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vendor-funding-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
