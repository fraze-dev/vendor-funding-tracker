name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start SQL Server in Docker via Testcontainers; ubuntu runners have Docker built in.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Check for EF model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/VendorFunding.Infrastructure \
            --startup-project src/VendorFunding.Api \
            --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  deploy:
    needs: build-and-test
    # Deploy from main only, and only once infra/bootstrap.ps1 has created the Azure variables.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.infra.outputs.dashboardUrl }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # push the image to GitHub Container Registry
      id-token: write   # sign in to Azure with OpenID Connect (no stored secrets)
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: vendor-funding-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build and push container image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Check the image can be pulled anonymously
        run: |
          docker logout ghcr.io
          if ! docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::Azure pulls the image without credentials, so the package must be public. One-time fix: open https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/${GITHUB_REPOSITORY#*/}, then Package settings > Change visibility > Public. Then re-run this job."
            exit 1
          fi

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          # Keep the currently running image during the infra deploy; the new one goes live after migrations.
          current=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)
          outputs=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "release-${GITHUB_RUN_NUMBER}" \
            --template-file infra/main.bicep \
            --parameters containerAppName="$APP_NAME" \
                         containerImage="${current:-$IMAGE}" \
                         sqlAdminGroupName="${{ vars.SQL_ADMIN_GROUP_NAME }}" \
                         sqlAdminGroupObjectId="${{ vars.SQL_ADMIN_GROUP_ID }}" \
            --query properties.outputs -o json)
          for key in appUrl sqlServerName sqlServerFqdn databaseName apiIdentityName apiIdentityClientId \
                     functionAppName functionsIdentityName functionsIdentityClientId dashboardName dashboardUrl; do
            echo "$key=$(jq -r ".$key.value" <<< "$outputs")" >> "$GITHUB_OUTPUT"
          done

      - name: Open SQL firewall for this runner
        run: |
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "$RESOURCE_GROUP" -s "${{ steps.infra.outputs.sqlServerName }}" \
            -n "github-run-${GITHUB_RUN_ID}" --start-ip-address "$ip" --end-ip-address "$ip" -o none

      - name: Apply database migrations
        env:
          # Signs in as the deploy identity via the Azure CLI session from azure/login.
          ConnectionStrings__VendorFunding: >-
            Server=tcp:${{ steps.infra.outputs.sqlServerFqdn }},1433;Database=${{ steps.infra.outputs.databaseName }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=120
        run: |
          dotnet tool restore
          dotnet restore src/VendorFunding.Api   # this job starts from a fresh checkout
          dotnet ef migrations bundle --project src/VendorFunding.Infrastructure --startup-project src/VendorFunding.Api \
            --configuration Release --output efbundle --force
          ./efbundle

      - name: Grant the API and Functions access to the database
        run: |
          server="${{ steps.infra.outputs.sqlServerFqdn }}"
          db="${{ steps.infra.outputs.databaseName }}"
          dotnet run infra/grant-db-access.cs -- "$server" "$db" \
            "${{ steps.infra.outputs.apiIdentityName }}" "${{ steps.infra.outputs.apiIdentityClientId }}"
          dotnet run infra/grant-db-access.cs -- "$server" "$db" \
            "${{ steps.infra.outputs.functionsIdentityName }}" "${{ steps.infra.outputs.functionsIdentityClientId }}"

      - name: Close SQL firewall
        if: always() && steps.infra.outputs.sqlServerName != ''
        run: |
          az sql server firewall-rule delete -g "$RESOURCE_GROUP" -s "${{ steps.infra.outputs.sqlServerName }}" \
            -n "github-run-${GITHUB_RUN_ID}" -o none || true

      - name: Deploy Functions
        run: |
          dotnet publish src/VendorFunding.Functions --configuration Release --output publish/functions
          (cd publish/functions && zip -qr ../functions.zip .)
          az functionapp deployment source config-zip -g "$RESOURCE_GROUP" \
            -n "${{ steps.infra.outputs.functionAppName }}" --src publish/functions.zip -o none

      - name: Release new image
        id: release
        run: |
          az containerapp update -g "$RESOURCE_GROUP" -n "$APP_NAME" --image "$IMAGE" -o none
          # The update returns once the new revision is created, not once it's serving traffic.
          # Wait for it, or the smoke tests can reach the previous version.
          for attempt in $(seq 1 30); do
            revisions=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\n' ' ')
            read -r latest ready <<< "$revisions"
            if [ "$latest" = "$ready" ]; then echo "Revision $latest is serving traffic."; break; fi
            echo "Waiting for revision $latest (attempt $attempt)..."
            sleep 10
          done
          echo "url=${{ steps.infra.outputs.appUrl }}" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          url="${{ steps.release.outputs.url }}"
          # The app scales to zero and the database auto-pauses, so the first request can take a minute.
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 30 "$url/health"; then echo; break; fi
            echo "Not healthy yet (attempt $attempt); waiting 15 seconds..."
            sleep 15
          done
          curl -fsS --max-time 30 "$url/health" > /dev/null
          curl -fsS --max-time 30 "$url/api/vendors" | jq .
          {
            echo "### Deployed :rocket:"
            echo "- API docs: $url/scalar"
            echo "- Demo: $url/api/vendors/1/funding-summary?period=2026-Q3"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test file ingestion
        run: |
          url="${{ steps.release.outputs.url }}"
          # One row for an item no deal covers, so it doesn't change any funding numbers.
          # The run ID makes the content unique, so it isn't treated as a duplicate of an earlier run.
          printf 'store_number,sku,sale_date,units_sold,net_sales\nSMOKE,SMOKE-%s,%s,1,0.01\n' \
            "$GITHUB_RUN_ID" "$(date -u +%F)" > smoke.csv
          # Retry briefly in case traffic is still moving to the new revision.
          for attempt in $(seq 1 6); do
            if import=$(curl -fsS --max-time 60 -F "file=@smoke.csv;type=text/csv" "$url/api/sales/files"); then break; fi
            echo "Upload failed (attempt $attempt); retrying in 10 seconds..."
            import=""
            sleep 10
          done
          [ -n "$import" ] || { echo "::error::The smoke-test upload kept failing."; exit 1; }
          id=$(jq -r .id <<< "$import")
          echo "Uploaded import $id; waiting for Event Grid → Service Bus → Functions → SQL..."
          # The Function app may be starting from zero on its first event after a deploy.
          for attempt in $(seq 1 30); do
            status=$(curl -fsS --max-time 30 "$url/api/sales/imports/$id" | jq -r .status)
            echo "Attempt $attempt: $status"
            if [ "$status" = "Completed" ]; then
              echo "- File ingestion: import \`$id\` completed end to end" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            case "$status" in CompletedWithErrors|Duplicate|Failed)
              curl -fsS "$url/api/sales/imports/$id" | jq .
              exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The smoke-test file wasn't loaded within 5 minutes. Check the Function app's logs and the sales-files and sales-records dead-letter queues."
          exit 1

      - name: Build dashboard
        run: |
          dotnet publish src/VendorFunding.Web --configuration Release --output publish/web
          # Point the dashboard at this environment's API, and drop the precompressed copies of the
          # template config so they can't be served in place of this one.
          echo "{ \"ApiBaseUrl\": \"${{ steps.infra.outputs.appUrl }}/\" }" > publish/web/wwwroot/appsettings.json
          rm -f publish/web/wwwroot/appsettings.json.br publish/web/wwwroot/appsettings.json.gz

      - name: Get the dashboard deployment token
        run: |
          # Fetched from Azure at deploy time (the OIDC session can read it), so no token is stored in GitHub.
          token=$(az staticwebapp secrets list -g "$RESOURCE_GROUP" -n "${{ steps.infra.outputs.dashboardName }}" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "SWA_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy dashboard
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: publish/web/wwwroot
          skip_app_build: true
          skip_api_build: true

      - name: Smoke test dashboard
        run: |
          dashboard="${{ steps.infra.outputs.dashboardUrl }}"
          api="${{ steps.release.outputs.url }}"
          curl -fsS --max-time 30 "$dashboard/" | grep -q "<title>Vendor Funding Tracker</title>"
          curl -fsS --max-time 30 "$dashboard/appsettings.json" | grep -q "$api"
          # Deep links load the app too (navigation fallback in staticwebapp.config.json).
          curl -fsS --max-time 30 -o /dev/null "$dashboard/ledger"
          # The API allows the dashboard's origin (CORS).
          curl -fsS --max-time 60 -o /dev/null -D - -X OPTIONS "$api/api/dashboard" \
            -H "Origin: $dashboard" -H "Access-Control-Request-Method: GET" | grep -qi "access-control-allow-origin: $dashboard"
          echo "- Dashboard: $dashboard" >> "$GITHUB_STEP_SUMMARY"
